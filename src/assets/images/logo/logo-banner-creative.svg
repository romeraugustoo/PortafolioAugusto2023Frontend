<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="100%" height="100%">
  <defs>
    <linearGradient id="creativePurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="creativeNeonLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="creativeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Glyph Centered Vertically -->
  <g transform="translate(15, 12) scale(0.31)">
    <polygon points="250,25 445,138 445,362 250,475 55,362 55,138" fill="#090a16" stroke="url(#creativePurpleGrad)" stroke-width="8" filter="url(#creativeGlow)"/>
    <path d="M250 115 L145 365 L198 365 L250 240 L302 365 L355 365 Z" fill="url(#creativePurpleGrad)"/>
    <path d="M250 240 L315 240 C355 240 380 210 380 178 C380 145 350 120 310 120 L250 120 Z" fill="none" stroke="url(#creativePurpleGrad)" stroke-width="28"/>
    <path d="M280 240 L355 365" stroke="url(#creativeNeonLeg)" stroke-width="30" stroke-linecap="round"/>
    <circle cx="250" cy="240" r="10" fill="#C084FC"/>
  </g>

  <!-- Centered Creative Brand Typography (+40% Size) -->
  <text x="180" y="108" font-family="'Outfit', 'Inter', sans-serif" font-size="54" font-weight="900" fill="#F8FAFC" letter-spacing="2">
    AUGUSTO <tspan fill="url(#creativePurpleGrad)">ROMERA</tspan>
  </text>
</svg>
