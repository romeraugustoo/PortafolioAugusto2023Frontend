<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Obsidian Hexagon Base -->
  <polygon points="250,25 445,138 445,362 250,475 55,362 55,138" fill="#070a12" stroke="url(#cyanEmerald)" stroke-width="6" filter="url(#neonGlow)"/>
  
  <!-- Inner Circuit Grid Accent -->
  <polygon points="250,55 415,150 415,350 250,445 85,350 85,150" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" stroke-dasharray="8,8"/>

  <!-- 'A' Monogram Structure -->
  <path d="M250 115 L145 365 L198 365 L250 240 L302 365 L355 365 Z" fill="url(#cyanEmerald)" filter="url(#neonGlow)"/>

  <!-- 'R' Monogram Head Loop -->
  <path d="M250 240 L315 240 C355 240 380 210 380 178 C380 145 350 120 310 120 L250 120 Z" fill="none" stroke="url(#cyanEmerald)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- 'R' Monogram Amber Leg (Dynamic Energy) -->
  <path d="M280 240 L355 365" stroke="url(#amberGold)" stroke-width="30" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Central Glowing Nexus Core -->
  <circle cx="250" cy="240" r="9" fill="#00F2FE" filter="url(#neonGlow)"/>
</svg>
