<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="favGradCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="favCyberLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="favGlowCyber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon Badge Frame -->
  <polygon points="256,26 455,141 455,371 256,486 57,371 57,141" fill="#040608" stroke="url(#favGradCyber)" stroke-width="16" filter="url(#favGlowCyber)"/>

  <!-- 'A' Monogram Apex & Arms -->
  <path d="M256 118 L151 368 L204 368 L256 243 L308 368 L361 368 Z" fill="url(#favGradCyber)"/>

  <!-- 'R' Monogram Loop -->
  <path d="M256 243 L321 243 C361 243 386 213 386 181 C386 148 356 123 316 123 L256 123 Z" fill="none" stroke="url(#favGradCyber)" stroke-width="28"/>

  <!-- 'R' Dynamic Diagonal Leg -->
  <path d="M286 243 L361 368" stroke="url(#favCyberLeg)" stroke-width="30" stroke-linecap="round"/>

  <!-- Nexus Core Dot -->
  <circle cx="256" cy="243" r="11" fill="#34D399"/>
</svg>
